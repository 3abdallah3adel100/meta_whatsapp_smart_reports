name: Smart WhatsApp Meta Reports

on:
  workflow_dispatch:
    inputs:
      range_key:
        description: "today | yesterday | 7d | 30d | this_month | last_month"
        required: true
        type: string

      team_key:
        description: "taher | cairo"
        required: true
        default: "taher"
        type: string

      agent_code:
        description: "ALL | AA | HM | BM | EK | MA | AF | SQ | OS | MM | NB"
        required: true
        default: "ALL"
        type: string

      report_types:
        description: "spend,age,governorate,allocation"
        required: true
        default: "spend"
        type: string

      recipient:
        description: "WhatsApp sender number"
        required: true
        type: string

      raw_command:
        description: "Original WhatsApp command for logs"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  generate-report:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate requested WhatsApp report
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_ACCESS_TOKEN_2: ${{ secrets.META_ACCESS_TOKEN_2 }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          META_API_VERSION: ${{ vars.META_API_VERSION || 'v26.0' }}
          REPORT_TIMEZONE: Africa/Cairo
          MAX_WORKERS: "8"

          # Single source of truth for Taher: Spend / Age / Governorate / Allocation.
          # Add a new Taher Business ID to the TAHER_BUSINESS_IDS GitHub Actions Variable.
          TAHER_BUSINESS_IDS: ${{ vars.TAHER_BUSINESS_IDS || '751488620224306,1178859133269743,1370772291128896' }}
          # Cairo remains separate and never joins the Taher totals.
          CAIRO_BUSINESS_ID: ${{ vars.CAIRO_BUSINESS_ID || '1935536750225128' }}
          OVERALL_ALLOCATION_BUDGET: ${{ vars.OVERALL_ALLOCATION_BUDGET || '0' }}
          MANUAL_BALANCE_OVERRIDES_JSON: ${{ secrets.MANUAL_BALANCE_OVERRIDES_JSON }}

        run: |
          python smart_report.py \
            --range "${{ inputs.range_key }}" \
            --team "${{ inputs.team_key }}" \
            --agent "${{ inputs.agent_code }}" \
            --reports "${{ inputs.report_types }}" \
            --recipient "${{ inputs.recipient }}" \
            --raw-command "${{ inputs.raw_command }}"

